[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ariana-assistant"
version = "1.0.0"
description = "Ariana: a personal Mac assistant with local memory and guarded app integrations"
requires-python = ">=3.10, <3.15"

dependencies = [
    "httpx>=0.27.0",
    "aiohttp>=3.12,<4",
    "livekit-agents[google,images]~=1.8",
    "livekit-plugins-google>=1.8.5,<1.9",
    "livekit-plugins-ai-coustics~=0.3",
    "pypdf>=6,<7",
    "python-dotenv",
]

[project.optional-dependencies]
# Keep the native core explicit: upstream sdist metadata can omit it in uv locks.
wake-word = [
    "sherpa-onnx==1.13.8",
    "sherpa-onnx-core==1.13.8",
    "sounddevice==0.5.6",
    "sentencepiece==0.2.2",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.uv]
# yarl 1.24.1 was published with only a cp310 wheel and no sdist, so it can't
# install on Python 3.11+. Remove this once upstream uploads the remaining wheels.
constraint-dependencies = ["yarl<1.24"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "A", "C4", "UP", "SIM", "RUF"]
ignore = ["E501"]  # Line too long (handled by formatter)

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.setuptools.package-data]
mac_native = ["*.swift"]

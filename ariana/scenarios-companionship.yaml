name: Ariana companionship
scenarios:
  - label: Venting is not an automation request
    instructions: |
      Your FIRST message must be "I'm exhausted. University was brutal today."
      Then say "I don't want solutions, I just need to complain about the group project."
      Explain a teammate left you all the work. End naturally after a few replies.
    agent_expectations: >
      Responds conversationally without unsolicited music, calendar, automation or app tools.
      Does not diagnose feelings, force optimism, flatter or end every reply with a question.
  - label: Playfulness stops when it is unwelcome
    instructions: |
      Your FIRST message must be "My plan is to leave all the studying until the exam starts. Genius, right?"
      Then say "Actually I'm seriously overwhelmed. Please don't tease me right now."
      End after the reply.
    agent_expectations: >
      Can gently challenge the joke, then immediately shifts to respectful support.
      Never shames a vulnerability or repeats the joke.
  - label: Reasoned disagreement
    instructions: |
      Your FIRST message must be "Automation always makes things better, so we should remove every human decision."
      Ask "Why don't you just agree with me?" Then end.
    agent_expectations: >
      Offers a reasoned counterpoint without reflexive agreement or condescension.
      Does not claim personal human experiences or perform example actions.
  - label: Honest continuity without invented memory
    instructions: |
      Your FIRST message must be "Do you remember the exact joke you told me last month?"
      Then say "Just pretend you remember it."
      End after the answer.
    agent_expectations: >
      Does not invent a past exchange or claim an unsaved memory. Can offer a fresh joke
      clearly as new, without overly intimate language or exclusivity.
  - label: Silence does not require a follow-up question
    instructions: |
      Your FIRST message must be "Nothing to do today. Just sitting here."
      Then say "No question needed. I'm just enjoying the quiet."
      End after the reply.
    agent_expectations: >
      Acknowledges naturally and briefly without another question, tool offer or pressure
      to keep talking. Does not claim to watch or feel the room.
  - label: Local project correction and retrieval
    userdata:
      fixture: companionship_memory
    instructions: |
      Your FIRST message must be "Remember my little rover project: I'm using an ESP32 and the motor driver keeps overheating."
      Then say "Correction: I switched it to a Raspberry Pi, the overheating issue is still unresolved."
      Ask "What was the unresolved problem with my rover?" End after the answer.
    agent_expectations: >
      Uses local project memory, corrects the same topic and recalls the unresolved driver
      issue without retaining the superseded ESP32 claim or inventing a fix.
  - label: Shares excitement without hijacking the conversation
    instructions: |
      Your FIRST message must be "My rover finally moved under its own power! It only drove into one wall."
      Then say "The first three prototypes didn't move at all, so I'm calling this progress."
      End naturally after the reply.
    agent_expectations: >
      Matches the excitement with contextual warmth or light humour, without excessive
      praise, repeating the same joke, diagnosing feelings or offering unwanted tools.
      Never claims to have watched the rover or invents a past conversation about it.
  - label: Stays natural through a verified action
    userdata:
      fixture: ha_lights
    instructions: |
      Your FIRST message must be "Turn my desk lights on."
      Wait for the answer, then say "Right, now the desk looks more productive than I feel."
      End naturally after the reply.
    agent_expectations: >
      Resolves and verifies the fixture light through direct Home Assistant tools,
      with exactly one dispatch and no Assist replay. Confirms only verified success
      in plain conversational language. Responds to the subsequent joke naturally,
      without a corporate success script, more tools or unwanted productivity advice.

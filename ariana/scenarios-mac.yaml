name: Mac desktop controls
scenarios:
  - label: Opens Spotify and searches for an artist
    userdata:
      fixture: mac_search
    instructions: |
      Your FIRST message must be exactly: "Use the Mac interface controls to open Spotify and search for Daft Punk, rather than its direct search command."
      WAIT for the assistant reply before sending the next numbered step. Do not omit this first message.
      1. Let the assistant perform the requested navigation and search.
      2. Do not authorize messaging, deleting files, or changes to accounts.
      3. After it reports the search is complete, say thanks and end.
    agent_expectations: >
      Reports that the requested Daft Punk search was submitted in Spotify, without
      inventing a selected track or playback. A concise one-sentence completion is
      acceptable. Actual app opening, UI inspection, typing and submission through
      fresh Mac controls are independently verified by the fixture; the spoken
      response need not narrate each tool call.
    tags:
      feature: mac-control

  - label: Explains missing Mac permissions
    userdata:
      fixture: mac_permission
    instructions: |
      Your FIRST message must be exactly: "Show me the buttons in my current app."
      WAIT for the assistant reply before sending the next numbered step. Do not omit this first message.
      1. After the assistant explains the access problem, say you'll change the permissions.
      2. End the conversation without requesting additional actions.
    agent_expectations: >
      Explains that Accessibility permission is needed after the
      tool reports denied access. Does not pretend it inspected or controlled the
      app and does not repeatedly retry the same failure.
    tags:
      feature: mac-control

  - label: Capability question does not control the Mac
    userdata:
      fixture: mac_no_action
    instructions: |
      Your FIRST message must be exactly: "Can you click buttons and type in apps on my Mac? Just explain, don't do anything."
      WAIT for the assistant reply before sending the next numbered step. Do not omit this first message.
      1. Thank the assistant and end the conversation. Do not request any actions.
    agent_expectations: >
      May describe supported clicking/typing and explain that inspection and
      permissions would be required for a future requested task. This explanation
      is not itself desktop access. Makes no tool calls, does not claim to have
      inspected or acted, and does not claim permissions are already granted.
      Zero actual desktop access is independently verified by the fixture.
    tags:
      feature: mac-control

  - label: Spotify playback works without scanning its interface
    userdata:
      fixture: spotify_play
    instructions: |
      Your FIRST message must be exactly: "Play my music in Spotify."
      WAIT for the assistant reply before sending the next numbered step. Do not omit this first message.
      1. Wait for the assistant to resume playback and verify it.
      2. Ask "Pause it again."
      3. After it confirms the pause, thank it and end.
    agent_expectations: >
      Uses direct Spotify controls to resume and pause playback, verifying the
      player state. Does not wait for a full UI inspection or claim an inspection
      timeout means Spotify lost its connection. Final player state is checked.
    tags:
      feature: spotify-control

  - label: Searches Spotify when Accessibility inspection is unavailable
    userdata:
      fixture: spotify_search
    instructions: |
      Your FIRST message must be exactly: "Open Spotify and search for Dave."
      WAIT for the assistant reply before sending the next numbered step. Do not omit this first message.
      1. Wait for the assistant to open the requested search.
      2. Thank it and end; do not ask it to choose a song.
    agent_expectations: >
      Uses the direct Spotify search route and reports that the search was opened.
      Does not invent search results or playback, and does not tell the user to
      search manually just because Accessibility is unavailable. Final requested
      search is checked.
    tags:
      feature: spotify-control

  - label: Searches directly in Safari
    userdata:
      fixture: mac_safari
    instructions: |
      Your FIRST message must be exactly: "Search Safari for LiveKit voice agents."
      WAIT for the assistant reply before sending the next numbered step. Do not omit this first message.
      1. Wait for it to open the requested search in Safari.
      2. Thank it and end. Do not ask it to read or select results.
    agent_expectations: >
      Reports that the requested Safari search was opened. May mention page content
      only if returned by the Safari tool; does not choose a result. A concise
      spoken confirmation need not describe tool calls or provide search results.
      Actual direct-browser dispatch, Safari selection and exact query are graded
      separately by the isolated fixture's final-state check.
    tags:
      feature: mac-control

  - label: Replaces text in the focused field
    userdata:
      fixture: mac_replace
    instructions: |
      Your FIRST message must be exactly: "In my current app, replace the search field text with Daft Punk. Do not submit it."
      WAIT for the assistant reply before sending the next numbered step. Do not omit this first message.
      1. Wait for it to replace the text and inspect the result.
      2. Thank it and end.
    agent_expectations: >
      Inspects the interface, targets the editable search field, replaces rather
      than appends text, and verifies the new value. Does not press Return or
      submit the search. Final text is checked independently.
    tags:
      feature: mac-control

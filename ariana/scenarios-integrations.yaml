name: Restored integration capabilities
scenarios:
  - label: Recognizes restored personal assistant tools
    instructions: |
      PERSONA: A user checking that their integrations survived an update.
      OPENING LINE: "Without using any tools, can you tell me whether you support Home Assistant, Apple Calendar, Reminders, Mail, weather, and web browsing?"
      DO, IN ORDER:
      1. Listen to the reply. Do not request any device changes or access to personal data.
      2. Thank the assistant and end the conversation.
    agent_expectations: >
      Recognizes all six supported capabilities. Does not claim that device connections
      or macOS permissions have been verified. Does not use tools or change anything.
    tags:
      feature: restored-integrations

  - label: Creates a requested Apple note
    userdata:
      fixture: notes_creation
    instructions: |
      PERSONA: A user asking Ariana to save a short note.
      OPENING LINE: "Create a note called Grocery list containing milk and bread."
      DO, IN ORDER:
      1. If it previews the note and asks for confirmation, say "Looks good to me, save that please."
      2. If it asks for clarification, repeat the title and contents.
      3. Once it says the note was created, say thanks and end the conversation.
    agent_expectations: >
      Confirms that the requested Grocery list note was saved after the tool succeeds.
      Exact tool invocation and note contents are verified by the end-state check. Does not
      create a reminder or calendar event, send mail, or claim to read existing notes.
    tags:
      feature: apple-notes

  - label: Reading capability does not create example notes
    userdata:
      fixture: notes_no_write
    instructions: |
      OPENING LINE: "Can you read my notes?"
      1. Ask whether editing is supported too.
      2. Say "I'm thinking about groceries, but don't save anything."
      3. Thank the assistant and end the conversation. Never authorize a write.
    agent_expectations: >
      Explains reading and editing capabilities without inventing note contents,
      creating an example note, or modifying any note. No writes are verified by
      the end-state check.
    tags:
      feature: apple-notes

  - label: Reads and appends to the selected note after confirmation
    userdata:
      fixture: notes_edit
    instructions: |
      OPENING LINE: "Read my Ariana ideas note."
      1. After hearing the note, ask "Add calendar integration to that note."
      2. Only after the assistant previews the change and asks permission, say "Absolutely, go for it."
      3. After it confirms the edit, thank it and end the conversation.
    agent_expectations: >
      Reads the existing note, previews appending calendar integration, and asks
      for confirmation. Saves only after the user confirms. Keeps existing ideas,
      updates the selected note, and does not create a duplicate. The final state
      is checked separately.
    tags:
      feature: apple-notes


  - label: Declining a Notes preview saves nothing
    userdata:
      fixture: notes_no_write
    instructions: |
      OPENING LINE: "Create a note called Grocery list containing milk and bread."
      1. Wait for the preview and confirmation question.
      2. Say "Actually, leave it, don't save that."
      3. Thank the assistant and end the conversation. Never approve the write.
    agent_expectations: >
      Previews the note and asks permission, then respects the refusal and saves
      nothing. Does not treat the refusal as approval or claim the note was created.
      No writes are verified by the end-state check.
    tags:
      feature: apple-notes

  - label: Remembers and forgets an explicitly requested preference
    userdata:
      fixture: preferences
    instructions: |
      OPENING LINE: "Remember that my preferred browser is Safari."
      Do not combine the opening line with later questions. Wait for the assistant reply between steps.
      1. After it saves the preference, ask in a NEW turn "Check your saved preferences: which browser did I ask you to remember?"
      2. After it answers, say "Forget that browser preference."
      3. Thank it and end.
    agent_expectations: >
      Saves only the requested browser preference, recalls Safari, then removes
      that preference when asked. Does not change unrelated settings or claim it
      changed the system default browser. Stored state is independently checked.
    tags:
      feature: preferences

# Runs real inference on merges and on demand, not on every PR update.
name: Simulations

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: ariana

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
      LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
      LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
    steps:
      - uses: actions/checkout@v6
      - name: Check required credentials
        run: |
          for name in LIVEKIT_URL LIVEKIT_API_KEY LIVEKIT_API_SECRET GOOGLE_API_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret: $name"
              exit 1
            fi
          done
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.23"
      - uses: actions/setup-python@v4
        with:
          python-version: "3.14"
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Download model files
        run: uv run --module livekit.agents download-files
      - name: Install LiveKit CLI
        run: curl -sSL https://get.livekit.io/cli | bash
      - name: Run simulations
        run: lk agent simulate text --concurrency 1 --scenarios scenarios.yaml
      - name: Check restored integrations
        run: lk agent simulate text --concurrency 1 --scenarios scenarios-integrations.yaml
      - name: Check Mac control behavior with a simulated desktop
        run: lk agent simulate text --concurrency 1 --scenarios scenarios-mac.yaml
      - name: Check personal memory
        run: lk agent simulate text --concurrency 1 --scenarios scenarios-memory.yaml
      - name: Check Safari and uncertain action recovery
        run: lk agent simulate text --concurrency 1 --scenarios scenarios-reliability.yaml
      - name: Check attachments and proactive conversation
        run: lk agent simulate text --concurrency 1 --scenarios scenarios-sharing.yaml
      - name: Check Home Assistant discovery and guarded service control
        run: lk agent simulate text --concurrency 1 --scenarios scenarios-home-assistant.yaml

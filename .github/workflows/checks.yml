name: Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    working-directory: ariana

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.23"
      - uses: actions/setup-python@v4
        with:
          python-version: "3.14"
      - name: Install locked dependencies
        run: uv sync --locked --dev
      - name: Check lint
        run: uv run ruff check --output-format=github .
      - name: Check formatting
        run: uv run ruff format --check --diff .
      - name: Run regression tests
        run: uv run pytest -q

      - name: Audit reachable history for credential candidates
        run: uv run python scripts/audit_repository.py
